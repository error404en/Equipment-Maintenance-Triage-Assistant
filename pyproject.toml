[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aggroso-assignment"
version = "0.1.0"
description = "Equipment Triage Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "groq"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
    "ruff",
    "mypy"
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "app.rules",
    "app.workflow"
]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
